name: Build signed Android release bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release-keystore.jks

      - name: Build signed release App Bundle (.aab)
        env:
          ORG_GRADLE_PROJECT_SIGNING_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: ./gradlew --no-daemon clean bundleRelease

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload generated mapping file
        uses: actions/upload-artifact@v4
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
